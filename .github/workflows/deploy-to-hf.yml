name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build clean deploy folder and push to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Copy repo into a fresh temp folder (completely separate from .git)
          mkdir /tmp/hf-deploy
          rsync -av --exclude='.git' \
            --exclude='src/data/case_outcomes/legal_dataset.csv' \
            --exclude='src/data/case_outcomes/cleaned_dataset.csv' \
            --exclude='src/data/case_outcomes/processed_dataset.csv' \
            --exclude='src/data/case_outcomes/split_data' \
            --exclude='src/data/case_outcomes/eda_visualizations' \
            --exclude='src/data/case_outcomes/evaluation' \
            --exclude='src/data/case_outcomes/training_reports' \
            --exclude='frontend' \
            . /tmp/hf-deploy/

          cd /tmp/hf-deploy

          git init -b main
          git config user.email "ritarshi007@gmail.com"
          git config user.name "Ritarshi Bandyopadhyay"
          git add .
          git commit -m "Deploy to HF Spaces"
          git push --force \
            https://ritB13:$HF_TOKEN@huggingface.co/spaces/ritB13/smart-legal-assistant main
