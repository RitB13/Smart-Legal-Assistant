name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]

jobs:
  sync-to-hf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Build clean deploy folder
        run: |
          mkdir -p /tmp/hf-deploy
          rsync -av --exclude='.git' \
            --exclude='frontend' \
            --exclude='src/data/case_outcomes/legal_dataset.csv' \
            --exclude='src/data/case_outcomes/cleaned_dataset.csv' \
            --exclude='src/data/case_outcomes/processed_dataset.csv' \
            --exclude='src/data/case_outcomes/split_data' \
            --exclude='src/data/case_outcomes/eda_visualizations' \
            --exclude='src/data/case_outcomes/evaluation' \
            --exclude='src/data/case_outcomes/training_reports' \
            --exclude='src/data/case_outcomes/models' \
            . /tmp/hf-deploy/

      - name: Upload to HF Space via API
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi

          api = HfApi()
          api.upload_folder(
              folder_path="/tmp/hf-deploy",
              repo_id="ritB13/smart-legal-assistant",
              repo_type="space",
              token=os.environ["HF_TOKEN"],
              commit_message="Deploy from GitHub Actions",
              ignore_patterns=["__pycache__", "*.pyc", "*.pyo", ".DS_Store"],
          )
          print("✅ Upload complete!")
          EOF
